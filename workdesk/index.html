<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Origen — Work Desk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #2c1a0e;
      --bg-raised:    #3a2010;
      --bg-card:      rgba(240,235,224,0.07);
      --text-primary: #f0ebe0;
      --text-secondary:#c8b89a;
      --text-muted:   #8b7355;
      --gold:         #c4963a;
      --green:        #4a7850;
      --green-light:  var(--green-light);
      --terra:        #c4714a;
      --border:       rgba(240,235,224,0.08);
      --border-hover: rgba(196,150,58,0.3);
      --sidebar-w:    204px;
      --radius:       8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-raised);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-logo img {
      width: 100%;
      max-width: 136px;
      height: auto;
      display: block;
    }

    .sidebar-nav {
      flex: 1;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text-muted);
      user-select: none;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover  { background: rgba(240,235,224,0.05); color: var(--text-secondary); }
    .nav-item.active { background: rgba(196,150,58,0.15);  color: var(--gold); }

    .nav-icon { font-size: 0.95rem; width: 16px; text-align: center; flex-shrink: 0; }

    /* ── Main ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 32px 36px;
      min-height: 100vh;
    }

    /* ── Sections ── */
    .section { display: none; }
    .section.active { display: block; }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .section-header::before {
      content: '';
      display: block;
      width: 3px;
      height: 22px;
      background: var(--gold);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 300;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--border-hover); }

    /* ── Grids ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

    /* ── Labels ── */
    .label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* ── Status tags ── */
    .tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid;
    }
    .tag-final   { background: rgba(74,120,86,0.15);  color: var(--green-light); border-color: rgba(74,120,86,0.25); }
    .tag-testing { background: rgba(196,150,58,0.12); color: var(--gold); border-color: rgba(196,150,58,0.25); }
    .tag-concept { background: rgba(240,235,224,0.06); color: var(--text-muted); border-color: var(--border); }

    /* ── Kanban ── */
    .kanban {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }
    .kb-col-header {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kb-col-header::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .kb-col[data-col="todo"]  .kb-col-header { color: var(--text-muted); }
    .kb-col[data-col="todo"]  .kb-col-header::before { background: var(--text-muted); }
    .kb-col[data-col="doing"] .kb-col-header { color: var(--gold); }
    .kb-col[data-col="doing"] .kb-col-header::before { background: var(--gold); }
    .kb-col[data-col="done"]  .kb-col-header { color: var(--green-light); }
    .kb-col[data-col="done"]  .kb-col-header::before { background: var(--green); }

    .kb-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-left-width: 3px;
      padding: 11px 13px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      user-select: none;
    }
    .kb-card:hover { transform: translateY(-1px); border-color: var(--border-hover); }
    .kb-card[data-status="todo"]  { border-left-color: var(--text-muted); }
    .kb-card[data-status="doing"] { border-left-color: var(--gold); }
    .kb-card[data-status="done"]  { border-left-color: var(--green); opacity: 0.75; }
    .kb-card-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .kb-card-note { font-size: 0.75rem; color: var(--text-muted); }
    .kb-hint { font-size: 0.68rem; color: var(--text-muted); margin-top: 16px; opacity: 0.6; }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
        height: 56px;
        top: auto;
        bottom: 0;
        flex-direction: row;
        border-right: none;
        border-top: 1px solid var(--border);
        overflow: visible;
      }
      .sidebar-logo { display: none; }
      .sidebar-nav {
        flex-direction: row;
        padding: 0;
        width: 100%;
        align-items: center;
        justify-content: space-around;
      }
      .nav-item {
        flex-direction: column;
        gap: 2px;
        padding: 8px 6px 6px;
        font-size: 0.62rem;
        border-radius: 0;
        flex: 1;
        justify-content: center;
        text-align: center;
      }
      .nav-item.active { background: none; border-top: 2px solid var(--gold); }
      .nav-icon { width: auto; font-size: 1.1rem; }
      .main {
        margin-left: 0;
        margin-bottom: 56px;
        padding: 20px 16px;
      }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .kanban { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="assets/logo.png" alt="Casa Origen" onerror="this.style.display='none'">
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-section="home">
      <span class="nav-icon">⊞</span> Home
    </button>
    <button class="nav-item" data-section="projects">
      <span class="nav-icon">▤</span> Projects
    </button>
    <button class="nav-item" data-section="sourcing">
      <span class="nav-icon">◎</span> Sourcing
    </button>
    <button class="nav-item" data-section="menu">
      <span class="nav-icon">✦</span> Menu
    </button>
    <button class="nav-item" data-section="team">
      <span class="nav-icon">◈</span> Team
    </button>
    <button class="nav-item" data-section="links">
      <span class="nav-icon">⬡</span> Links
    </button>
  </nav>
</aside>

<main class="main">
  <section id="home"     class="section active"></section>
  <section id="projects" class="section"></section>
  <section id="sourcing" class="section"></section>
  <section id="menu"     class="section"></section>
  <section id="team"     class="section"></section>
  <section id="links"    class="section"></section>
</main>

<script>
  // ── Data ──────────────────────────────────────────────────────────────────

  const projects = [
    { id: 1, name: 'Kitchen Layout',    note: 'Waiting on contractor quote',   status: 'doing', pct: 40 },
    { id: 2, name: 'Coffee Program',    note: 'Sourcing local roasters',        status: 'doing', pct: 55 },
    { id: 3, name: 'Menu Development',  note: 'Breakfast items v2 in testing', status: 'doing', pct: 65 },
    { id: 4, name: 'Staff Hiring',      note: '',                               status: 'todo',  pct: 0  },
    { id: 5, name: 'POS Setup',         note: 'Square for Restaurants',         status: 'todo',  pct: 5  },
    { id: 6, name: 'Brand Identity',    note: 'Logo and colors finalized',      status: 'done',  pct: 100 },
    { id: 7, name: 'Permit Applications', note: 'Filed June 2026',             status: 'done',  pct: 100 },
  ];

  const STATUS_META = {
    doing: { color: '#c4963a', label: 'In Progress' },
    todo:  { color: '#8b7355', label: 'Not Started' },
    done:  { color: '#4a7850', label: 'Done' },
  };

  // ── Home section ──────────────────────────────────────────────────────────

  function renderHome() {
    const el = document.getElementById('home');
    el.innerHTML = `
      <div class="section-header">
        <h1 class="section-title">Overview</h1>
      </div>
      <div class="grid-2">
        ${projects.map(p => {
          const meta = STATUS_META[p.status];
          return `
            <div class="card">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                <span style="width:9px;height:9px;border-radius:50%;background:${meta.color};flex-shrink:0;display:inline-block"></span>
                <span style="font-weight:600;color:var(--text-primary);font-size:0.88rem">${p.name}</span>
              </div>
              <div style="height:3px;background:var(--border);border-radius:2px;margin-bottom:8px">
                <div style="height:3px;width:${p.pct}%;background:${meta.color};border-radius:2px;transition:width 0.3s"></div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center">
                <span style="font-size:0.75rem;color:var(--text-muted)">${p.note || '&nbsp;'}</span>
                <span style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:${meta.color}">${meta.label}</span>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // Navigation
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      item.classList.add('active');
      document.getElementById(item.dataset.section).classList.add('active');
    });
  });

  renderHome();
</script>

</body>
</html>
