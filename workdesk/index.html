<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casa Origen — Work Desk</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #2c1a0e;
      --bg-raised:    #3a2010;
      --bg-card:      rgba(240,235,224,0.07);
      --text-primary: #f0ebe0;
      --text-secondary:#c8b89a;
      --text-muted:   #8b7355;
      --gold:         #c4963a;
      --green:        #4a7850;
      --green-light:  #6ab880;
      --terra:        #c4714a;
      --border:       rgba(240,235,224,0.08);
      --border-hover: rgba(196,150,58,0.3);
      --sidebar-w:    204px;
      --radius:       8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-raised);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-logo img {
      width: 100%;
      max-width: 136px;
      height: auto;
      display: block;
    }

    .sidebar-nav {
      flex: 1;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      background: none;
      border: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text-muted);
      user-select: none;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover  { background: rgba(240,235,224,0.05); color: var(--text-secondary); }
    .nav-item.active { background: rgba(196,150,58,0.15);  color: var(--gold); }

    .nav-icon { font-size: 0.95rem; width: 16px; text-align: center; flex-shrink: 0; }

    /* ── Main ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 32px 36px;
      min-height: 100vh;
    }

    /* ── Sections ── */
    .section { display: none; }
    .section.active { display: block; }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .section-header::before {
      content: '';
      display: block;
      width: 3px;
      height: 22px;
      background: var(--gold);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 300;
      color: var(--text-primary);
      letter-spacing: 0.02em;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: var(--border-hover); }

    /* ── Grids ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

    /* ── Labels ── */
    .label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    /* ── Status tags ── */
    .tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid;
    }
    .tag-final   { background: rgba(74,120,86,0.15);  color: var(--green-light); border-color: rgba(74,120,86,0.25); }
    .tag-testing { background: rgba(196,150,58,0.12); color: var(--gold); border-color: rgba(196,150,58,0.25); }
    .tag-concept { background: rgba(240,235,224,0.06); color: var(--text-muted); border-color: var(--border); }

    /* ── Kanban ── */
    .kanban {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }
    .kb-col-header {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kb-col-header::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .kb-col[data-col="todo"]  .kb-col-header { color: var(--text-muted); }
    .kb-col[data-col="todo"]  .kb-col-header::before { background: var(--text-muted); }
    .kb-col[data-col="doing"] .kb-col-header { color: var(--gold); }
    .kb-col[data-col="doing"] .kb-col-header::before { background: var(--gold); }
    .kb-col[data-col="done"]  .kb-col-header { color: var(--green-light); }
    .kb-col[data-col="done"]  .kb-col-header::before { background: var(--green); }

    .kb-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-left-width: 3px;
      padding: 11px 13px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.1s;
      user-select: none;
    }
    .kb-card:hover { transform: translateY(-1px); border-color: var(--border-hover); }
    .kb-card[data-status="todo"]  { border-left-color: var(--text-muted); }
    .kb-card[data-status="doing"] { border-left-color: var(--gold); }
    .kb-card[data-status="done"]  { border-left-color: var(--green); opacity: 0.75; }
    .kb-card-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .kb-card-note { font-size: 0.75rem; color: var(--text-muted); }
    .kb-hint { font-size: 0.68rem; color: var(--text-muted); margin-top: 16px; opacity: 0.6; }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      .sidebar {
        width: 100%;
        height: 56px;
        top: auto;
        bottom: 0;
        flex-direction: row;
        border-right: none;
        border-top: 1px solid var(--border);
        overflow: visible;
      }
      .sidebar-logo { display: none; }
      .sidebar-nav {
        flex-direction: row;
        padding: 0;
        width: 100%;
        align-items: center;
        justify-content: space-around;
      }
      .nav-item {
        flex-direction: column;
        gap: 2px;
        padding: 8px 6px 6px;
        font-size: 0.62rem;
        border-radius: 0;
        flex: 1;
        justify-content: center;
        text-align: center;
      }
      .nav-item.active { background: none; border-top: 2px solid var(--gold); }
      .nav-icon { width: auto; font-size: 1.1rem; }
      .main {
        margin-left: 0;
        margin-bottom: 56px;
        padding: 20px 16px;
      }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .kanban { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <img src="assets/logo.png" alt="Casa Origen" onerror="this.style.display='none'">
  </div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-section="home">
      <span class="nav-icon">⊞</span> Home
    </button>
    <button class="nav-item" data-section="projects">
      <span class="nav-icon">▤</span> Projects
    </button>
    <button class="nav-item" data-section="sourcing">
      <span class="nav-icon">◎</span> Sourcing
    </button>
    <button class="nav-item" data-section="menu">
      <span class="nav-icon">✦</span> Menu
    </button>
    <button class="nav-item" data-section="team">
      <span class="nav-icon">◈</span> Team
    </button>
    <button class="nav-item" data-section="links">
      <span class="nav-icon">⬡</span> Links
    </button>
  </nav>
</aside>

<main class="main">
  <section id="home"     class="section active"></section>
  <section id="projects" class="section"></section>
  <section id="sourcing" class="section"></section>
  <section id="menu"     class="section"></section>
  <section id="team"     class="section"></section>
  <section id="links"    class="section"></section>
</main>

<script>
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ── Data ──────────────────────────────────────────────────────────────────

  const projects = [
    { id: 1, name: 'Kitchen Layout',    note: 'Waiting on contractor quote',   status: 'doing', pct: 40 },
    { id: 2, name: 'Coffee Program',    note: 'Sourcing local roasters',        status: 'doing', pct: 55 },
    { id: 3, name: 'Menu Development',  note: 'Breakfast items v2 in testing', status: 'doing', pct: 65 },
    { id: 4, name: 'Staff Hiring',      note: '',                               status: 'todo',  pct: 0  },
    { id: 5, name: 'POS Setup',         note: 'Square for Restaurants',         status: 'todo',  pct: 5  },
    { id: 6, name: 'Brand Identity',    note: 'Logo and colors finalized',      status: 'done',  pct: 100 },
    { id: 7, name: 'Permit Applications', note: 'Filed June 2026',             status: 'done',  pct: 100 },
  ];

  const STATUS_META = {
    doing: { color: 'var(--gold)',       label: 'In Progress' },
    todo:  { color: 'var(--text-muted)', label: 'Not Started' },
    done:  { color: 'var(--green)',      label: 'Done' },
  };

  // ── Home section ──────────────────────────────────────────────────────────

  function renderHome() {
    const el = document.getElementById('home');
    const openingDate = new Date('2026-09-01');
    const today = new Date();
    const daysLeft = Math.max(0, Math.ceil((openingDate - today) / (1000 * 60 * 60 * 24)));
    const doing = projects.filter(p => p.status === 'doing').length;
    const done  = projects.filter(p => p.status === 'done').length;

    el.innerHTML = `
    <div class="section-header">
      <h1 class="section-title">Overview</h1>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:24px">
      <div class="card" style="flex:1;text-align:center;padding:16px">
        <div style="font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--gold);line-height:1">${daysLeft}</div>
        <div style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-top:4px">Days to Opening</div>
      </div>
      <div class="card" style="flex:1;text-align:center;padding:16px">
        <div style="font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--gold);line-height:1">${doing}</div>
        <div style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-top:4px">In Progress</div>
      </div>
      <div class="card" style="flex:1;text-align:center;padding:16px">
        <div style="font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--green);line-height:1">${done}</div>
        <div style="font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-top:4px">Done</div>
      </div>
    </div>
    <div class="grid-2">
      ${projects.map(p => {
        const meta = STATUS_META[p.status] ?? STATUS_META['todo'];
        return `
          <div class="card">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
              <span style="width:9px;height:9px;border-radius:50%;background:${meta.color};flex-shrink:0;display:inline-block"></span>
              <span style="font-weight:600;color:var(--text-primary);font-size:0.88rem">${esc(p.name)}</span>
            </div>
            <div style="height:3px;background:var(--border);border-radius:2px;margin-bottom:8px">
              <div style="height:3px;width:${p.pct}%;background:${meta.color};border-radius:2px;transition:width 0.3s"></div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:0.75rem;color:var(--text-muted)">${esc(p.note) || '&nbsp;'}</span>
              <span style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:${meta.color}">${esc(meta.label)}</span>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
  }

  // ── Projects section (Kanban) ──────────────────────────────────────────────

  const STATUS_CYCLE = { todo: 'doing', doing: 'done', done: 'todo' };
  const COL_LABELS   = { todo: 'Not Started', doing: 'In Progress', done: 'Done' };

  function renderProjects() {
    const el = document.getElementById('projects');
    const cols = ['todo', 'doing', 'done'];

    el.innerHTML = `
      <div class="section-header">
        <h1 class="section-title">Projects</h1>
      </div>
      <div class="kanban">
        ${cols.map(col => `
          <div class="kb-col" data-col="${col}">
            <div class="kb-col-header">${esc(COL_LABELS[col])}</div>
            ${projects.filter(p => p.status === col).map(p => `
              <div class="kb-card" data-status="${p.status}" data-id="${p.id}">
                <div class="kb-card-name">${esc(p.name)}</div>
                ${p.note ? `<div class="kb-card-note">${esc(p.note)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
      <p class="kb-hint">Click a card to move it to the next stage.</p>
    `;

    // Click handler — cycle status, sync pct, re-render both views
    el.querySelectorAll('.kb-card').forEach(card => {
      card.addEventListener('click', () => {
        const proj = projects.find(p => p.id === Number(card.dataset.id));
        proj.status = STATUS_CYCLE[proj.status];
        proj.pct = proj.status === 'done' ? 100 : proj.status === 'doing' ? Math.max(proj.pct, 10) : 0;
        renderProjects();
        renderHome();
      });
    });
  }

  // ── Sourcing section ──────────────────────────────────────────────────────

  const vendors = [
    { name: 'Worden Farm',     supply: 'Certified organic vegetables',   contact: 'Eva Worden',   method: 'Email',     notes: 'Sarasota, FL — 3-day lead time' },
    { name: 'Lard & Lard',     supply: 'Grass-fed tallow',               contact: 'Kevin Lard',   method: 'Phone',     notes: 'Order Mondays for Thursday delivery' },
    { name: 'Big Top Coffee',  supply: 'Local roast + retail bags',       contact: 'Jess',         method: 'Instagram', notes: 'St. Pete — pickup or delivery' },
    { name: 'Fortunata Farm',  supply: 'Pasture-raised eggs',             contact: 'Maria',        method: 'Text',      notes: '2-day lead, limited qty — order weekly' },
    { name: 'Suncoast Micro',  supply: 'Microgreens + edible flowers',    contact: 'Tom',          method: 'Email',     notes: 'Weekly harvest, contact by Wednesday' },
  ];

  function renderSourcing() {
    const el = document.getElementById('sourcing');
    el.innerHTML = `
      <div class="section-header">
        <h1 class="section-title">Sourcing</h1>
      </div>
      <div class="grid-2">
        ${vendors.map(v => `
          <div class="card">
            <div style="margin-bottom:10px">
              <div style="font-size:0.95rem;font-weight:600;color:var(--text-primary);margin-bottom:3px">${esc(v.name)}</div>
              <div style="font-size:0.8rem;color:var(--gold)">${esc(v.supply)}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px">
              <div style="display:flex;gap:6px">
                <span class="label" style="margin:0;flex-shrink:0;padding-top:1px">Contact</span>
                <span style="font-size:0.8rem;color:var(--text-secondary)">${esc(v.contact)} · ${esc(v.method)}</span>
              </div>
              <div style="display:flex;gap:6px">
                <span class="label" style="margin:0;flex-shrink:0;padding-top:1px">Notes</span>
                <span style="font-size:0.8rem;color:var(--text-muted)">${esc(v.notes)}</span>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // ── Menu section ──────────────────────────────────────────────────────────

  const menuItems = [
    { category: 'Breakfast', name: 'Tallow Scramble',   status: 'final',   desc: 'Pasture eggs, garden herbs, house sourdough' },
    { category: 'Breakfast', name: 'Grain Bowl',         status: 'testing', desc: 'Sprouted oats, seasonal fruit, local honey' },
    { category: 'Breakfast', name: 'Avocado Toast',      status: 'concept', desc: 'House sourdough, EVOO, sea salt, microgreens' },
    { category: 'Lunch',     name: 'Farm Salad',         status: 'final',   desc: 'Daily rotation, local greens, EVOO dressing' },
    { category: 'Lunch',     name: 'Tallow Bowl',        status: 'testing', desc: 'Grass-fed beef, roasted roots, chimichurri' },
    { category: 'Lunch',     name: 'Garden Wrap',        status: 'concept', desc: 'Seasonal veg, house tahini, sprouts' },
    { category: 'Drinks',    name: 'Cold Brew',          status: 'final',   desc: 'Big Top beans, 20-hour steep' },
    { category: 'Drinks',    name: 'Agua Fresca',        status: 'concept', desc: 'Seasonal fruit, no added sugar' },
    { category: 'Retail',    name: 'House Tallow',       status: 'final',   desc: '8oz jar, grass-fed, rendered in-house' },
    { category: 'Retail',    name: 'Big Top Beans',      status: 'final',   desc: '12oz bag, local roast' },
    { category: 'Retail',    name: 'Agua Fresca Bottle', status: 'concept', desc: 'Bottled seasonal blend, 16oz' },
  ];

  const MENU_CATEGORIES = ['Breakfast', 'Lunch', 'Drinks', 'Retail'];

  function renderMenu() {
    const el = document.getElementById('menu');
    el.innerHTML = `
      <div class="section-header">
        <h1 class="section-title">Menu</h1>
      </div>
      ${MENU_CATEGORIES.map(cat => {
        const items = menuItems.filter(m => m.category === cat);
        return `
          <div style="margin-bottom:28px">
            <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-muted);margin-bottom:12px;display:flex;align-items:center;gap:8px">
              <span style="display:block;width:20px;height:1px;background:var(--border)"></span>
              ${esc(cat)}
              <span style="display:block;flex:1;height:1px;background:var(--border)"></span>
            </div>
            <div class="grid-3">
              ${items.map(item => `
                <div class="card">
                  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px">
                    <span style="font-size:0.88rem;font-weight:600;color:var(--text-primary)">${esc(item.name)}</span>
                    <span class="tag tag-${item.status}" style="flex-shrink:0">${esc(item.status.charAt(0).toUpperCase() + item.status.slice(1))}</span>
                  </div>
                  <div style="font-size:0.78rem;color:var(--text-muted);line-height:1.5">${esc(item.desc)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('')}
    `;
  }

  // ── Team section ──────────────────────────────────────────────────────────

  const team = [
    { name: 'Bryan Gallagher', role: 'Founder', initials: 'BG', contact: 'bryan@casaorigen.com', color: '#c4963a' },
  ];

  function renderTeam() {
    const el = document.getElementById('team');
    el.innerHTML = `
      <div class="section-header">
        <h1 class="section-title">Team</h1>
      </div>
      <div class="grid-3">
        ${team.map(m => `
          <div class="card" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 16px;gap:10px">
            <div style="
              width:56px;height:56px;border-radius:50%;
              background:${m.color}22;
              border:2px solid ${m.color}55;
              display:flex;align-items:center;justify-content:center;
              font-family:'Cormorant Garamond',serif;
              font-size:1.1rem;font-weight:400;
              color:${m.color};
            ">${esc(m.initials)}</div>
            <div>
              <div style="font-size:0.92rem;font-weight:600;color:var(--text-primary);margin-bottom:3px">${esc(m.name)}</div>
              <div style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">${esc(m.role)}</div>
            </div>
            <div style="font-size:0.78rem;color:var(--gold)">${esc(m.contact)}</div>
          </div>
        `).join('')}
      </div>
      <p style="margin-top:20px;font-size:0.78rem;color:var(--text-muted)">
        Add team members by editing the <code style="background:var(--bg-raised);padding:1px 5px;border-radius:3px;font-size:0.72rem">team</code> array in index.html.
      </p>
    `;
  }

  // ── Links section ─────────────────────────────────────────────────────────

  const linkGroups = [
    {
      group: 'Planning',
      links: [
        { label: 'Project Drive',     url: '#', desc: 'Shared Google Drive' },
        { label: 'Brand Assets',      url: '#', desc: 'Logos, colors, fonts' },
        { label: 'Opening Checklist', url: '#', desc: 'Master task list' },
      ]
    },
    {
      group: 'Design',
      links: [
        { label: 'Floor Plan',  url: '#', desc: 'Space layout CAD' },
        { label: 'Menu Design', url: '#', desc: 'Print-ready files' },
      ]
    },
    {
      group: 'Operations',
      links: [
        { label: 'Staff Portal',   url: 'https://wisdomsurgery.team', desc: 'Timeclock + timesheets' },
        { label: 'Supplier Docs',  url: '#', desc: 'Contracts + invoices' },
      ]
    },
    {
      group: 'External',
      links: [
        { label: 'Square Dashboard', url: '#',                                    desc: 'POS + payments' },
        { label: 'Instagram',        url: 'https://instagram.com/casa.origen',    desc: '@casa.origen' },
      ]
    },
  ];

  function renderLinks() {
    const el = document.getElementById('links');
    el.innerHTML = `
      <div class="section-header">
        <h1 class="section-title">Links</h1>
      </div>
      <div class="grid-2">
        ${linkGroups.map(group => `
          <div style="display:flex;flex-direction:column;gap:6px">
            <div class="label" style="margin-bottom:4px">${esc(group.group)}</div>
            ${group.links.map(link => `
              <a href="${esc(link.url)}" target="_blank" rel="noopener" style="text-decoration:none">
                <div class="card" style="display:flex;align-items:center;gap:12px;padding:11px 14px">
                  <div style="flex:1">
                    <div style="font-size:0.85rem;font-weight:600;color:var(--text-primary);margin-bottom:2px">${esc(link.label)}</div>
                    <div style="font-size:0.75rem;color:var(--text-muted)">${esc(link.desc)}</div>
                  </div>
                  <span style="color:var(--text-muted);font-size:0.8rem;flex-shrink:0">↗</span>
                </div>
              </a>
            `).join('')}
          </div>
        `).join('')}
      </div>
      <p style="margin-top:20px;font-size:0.78rem;color:var(--text-muted)">
        Update links by editing the <code style="background:var(--bg-raised);padding:1px 5px;border-radius:3px;font-size:0.72rem">linkGroups</code> array in index.html.
      </p>
    `;
  }

  // Navigation
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      item.classList.add('active');
      document.getElementById(item.dataset.section).classList.add('active');
    });
  });

  renderHome();
  renderProjects();
  renderSourcing();
  renderMenu();
  renderTeam();
  renderLinks();
</script>

</body>
</html>
